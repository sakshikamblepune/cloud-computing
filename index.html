<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f9;
    }

    .header {
      background: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #219150;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      color: green;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #2c3e50;
      color: white;
    }
  </style>
</head>
<body>

  <div class="header">College Dashboard</div>

  <div class="container">
    <h2>Student Registration</h2>

    <input type="text" id="name" placeholder="Enter Name" />
    <input type="email" id="email" placeholder="Enter Email" />
    <input type="text" id="address" placeholder="Enter Address" />
    <input type="text" id="course" placeholder="Enter Course" />

    <button onclick="addStudent()">Add Student</button>

    <div class="message" id="msg"></div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Address</th>
          <th>Course</th>
        </tr>
      </thead>
      <tbody id="studentTable"></tbody>
    </table>
  </div>

  <script>
    function addStudent() {
      let name = document.getElementById("name").value;
      let email = document.getElementById("email").value;
      let address = document.getElementById("address").value;
      let course = document.getElementById("course").value;

      if (name === "" || email === "" || address === "" || course === "") {
        alert("Please fill all fields");
        return;
      }

      let table = document.getElementById("studentTable");
      let row = table.insertRow();

      row.insertCell(0).innerHTML = name;
      row.insertCell(1).innerHTML = email;
      row.insertCell(2).innerHTML = address;
      row.insertCell(3).innerHTML = course;

      document.getElementById("msg").innerText = "Registration Successful!";

      document.getElementById("name").value = "";
      document.getElementById("email").value = "";
      document.getElementById("address").value = "";
      document.getElementById("course").value = "";

      setTimeout(() => {
        document.getElementById("msg").innerText = "";
      }, 3000);
    }
  </script>

</body>
</html>
